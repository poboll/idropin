server:
  port: 8081
  address: 0.0.0.0
  servlet:
    context-path: /api
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

app:
  backend-url: ${APP_BACKEND_URL:http://localhost:8081/api}

spring:
  application:
    name: idropin-backend

  threads:
    virtual:
      enabled: true

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/idropin?stringtype=unspecified
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: IdropinHikariPool

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 2000ms
          max-idle: 10
          min-idle: 2

  # 邮件配置 (Microsoft Outlook SMTP)
  mail:
    host: ${MAIL_HOST:smtp-mail.outlook.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:i@caiths.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:smtp-mail.outlook.com}

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.idropin.domain.entity
  type-handlers-package: com.idropin.infrastructure.config
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-fetch-size: 200
    default-statement-timeout: 30
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# MinIO配置 (storage.type=minio 时启用)
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: idropin-files

# 存储配置 - 可选: local(默认), minio, qiniu
storage:
  type: minio
  root-prefix: idropin
  local:
    path: ./uploads
    base-url: http://localhost:8081/api/files/download

# 七牛云配置 (storage.type=qiniu 时启用，凭证从数据库读取)
qiniu:
  access-key: ${QINIU_ACCESS_KEY:}
  secret-key: ${QINIU_SECRET_KEY:}
  bucket: idropin-files
  domain: qixint.caiths.com
  region: as0

# 日志配置
logging:
  level:
    com.idropin: info
    org.springframework.web: info
    org.springframework.security: info
  pattern:
      console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p){blue} %clr(%logger{25}){cyan} %clr(-){faint} %msg%n"
      file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  file:
    name: logs/idropin.log

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: true

# 文件存储配置
file:
  upload:
    path: /tmp/uploads
    max-size: 104857600 # 100MB
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - video/mp4
      - video/avi
      - video/quicktime
      - audio/mpeg
      - audio/wav
      - application/zip
      - application/x-rar-compressed
      - text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
